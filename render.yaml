# Backend only on Render Free; PostgreSQL is hosted separately on Neon.
# See RENDER_BACKEND.md. No Render database is created by this Blueprint.
services:
  - type: web
    name: ga-u-muoi-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        sync: false
      - key: BACKEND_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: STORE_AI_MODEL
        sync: false
      - key: OWNER_TOTP_SECRET
        sync: false
      - key: AI_DAILY_LIMIT
        value: "100"

