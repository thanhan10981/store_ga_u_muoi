# Backend + PostgreSQL only. Frontend is deployed separately on Vercel.
# Bootstrap the DB first using deploy/render-setup.mjs; see VERCEL_RENDER.md.
services:
  - type: web
    name: ga-u-muoi-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        sync: false
      - key: BACKEND_PROXY_SECRET
        generateValue: true
      - key: PGHOST
        fromDatabase:
          name: ga-u-muoi-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: ga-u-muoi-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: ga-u-muoi-db
          property: database
      - key: PGUSER
        value: store_app
      - key: PGPASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STORE_AI_MODEL
        sync: false
      - key: OWNER_TOTP_SECRET
        sync: false
      - key: AI_DAILY_LIMIT
        value: "100"

databases:
  - name: ga-u-muoi-db
    databaseName: store
    user: store_admin
    # Render Free Postgres expires after 30 days; export data before expiry.
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    # Block public DB access. Temporarily allow only your own IP for local bootstrap.
    ipAllowList: []
